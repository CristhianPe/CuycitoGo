<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <radialGradient id="crunchBg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#4a1a02"/>
      <stop offset="50%" stop-color="#240c01"/>
      <stop offset="100%" stop-color="#0a0300"/>
    </radialGradient>
    <linearGradient id="crunchOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7a00"/>
      <stop offset="100%" stop-color="#f44336"/>
    </linearGradient>
    <filter id="glowOrange" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#crunchBg)"/>

  <!-- Glowing Orange Aura -->
  <circle cx="400" cy="180" r="160" fill="#ff7a00" opacity="0.3" filter="url(#glowOrange)"/>

  <!-- Crunchyroll Official Logo & Icon -->
  <g transform="translate(400, 165)" text-anchor="middle">
    <!-- Icon Circle -->
    <g transform="translate(-160, 0)">
      <!-- Outer Orange Circle -->
      <circle cx="0" cy="0" r="44" fill="#ff7a00" filter="url(#glowOrange)"/>
      <!-- Inner Dark Crescent (Eye Pupil) -->
      <circle cx="10" cy="-6" r="28" fill="#180700"/>
      <circle cx="2" cy="-4" r="18" fill="#ff7a00"/>
    </g>

    <!-- Typography -->
    <text x="65" y="16" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="54" fill="#ffffff" letter-spacing="-1">
      crunchyroll
    </text>
  </g>

  <!-- Subtitle Anime Simulcast (Mega Fan, Todo el Anime Sin Anuncios, Simulcast Japón) -->
  <g transform="translate(400, 275)" text-anchor="middle">
    <rect x="-240" y="-18" width="480" height="36" rx="18" fill="#000000" fill-opacity="0.6" stroke="#ff7a00" stroke-width="1.5"/>
    <text x="0" y="5" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="11" fill="#fdba74" letter-spacing="3">
      MEGA FAN • SIMULCAST DESDE JAPÓN • SIN ANUNCIOS
    </text>
  </g>

  <!-- Top Badges -->
  <g transform="translate(40, 45)">
    <rect width="120" height="26" rx="6" fill="#ff7a00" fill-opacity="0.25" stroke="#ff7a00" stroke-width="1"/>
    <text x="60" y="17" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="10" fill="#fdba74" letter-spacing="1">ANIME HD TOTAL</text>
  </g>

  <g transform="translate(640, 45)">
    <rect width="120" height="26" rx="6" fill="#000000" fill-opacity="0.6" stroke="#fbbf24" stroke-width="1"/>
    <text x="60" y="17" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="10" fill="#fbbf24" letter-spacing="1">PIN PRIVADO</text>
  </g>

  <!-- Bottom Badges Bar -->
  <g transform="translate(400, 395)" text-anchor="middle">
    <text x="0" y="0" font-family="sans-serif" font-weight="700" font-size="11" fill="#64748b" letter-spacing="1">
      ESTRENOS 1 HORA DESPUÉS DE JAPÓN • DESCARGAS OFFLINE • FULL HD
    </text>
  </g>
</svg>
