<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <radialGradient id="maxBg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#301366"/>
      <stop offset="50%" stop-color="#14062e"/>
      <stop offset="100%" stop-color="#070212"/>
    </radialGradient>
    <linearGradient id="maxPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#maxBg)"/>

  <!-- Glowing Purple Aura -->
  <circle cx="400" cy="180" r="160" fill="#8b5cf6" opacity="0.3" filter="url(#glowPurple)"/>

  <!-- Max Logo Typography -->
  <g transform="translate(400, 185)" text-anchor="middle">
    <!-- Big Bold max wordmark -->
    <text x="0" y="20" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="110" fill="#ffffff" letter-spacing="-3" filter="url(#glowPurple)">
      max
    </text>
  </g>

  <!-- Subtitle Hub Brands (HBO • Warner Bros • Discovery • DC Universe) -->
  <g transform="translate(400, 290)" text-anchor="middle">
    <rect x="-260" y="-18" width="520" height="36" rx="18" fill="#000000" fill-opacity="0.6" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="0" y="5" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="11" fill="#c084fc" letter-spacing="3">
      HBO • WARNER BROS • DISCOVERY • DC
    </text>
  </g>

  <!-- Top Badges -->
  <g transform="translate(40, 45)">
    <rect width="120" height="26" rx="6" fill="#8b5cf6" fill-opacity="0.25" stroke="#8b5cf6" stroke-width="1"/>
    <text x="60" y="17" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="10" fill="#c084fc" letter-spacing="1">PLATINO 4K</text>
  </g>

  <g transform="translate(640, 45)">
    <rect width="120" height="26" rx="6" fill="#000000" fill-opacity="0.6" stroke="#fbbf24" stroke-width="1"/>
    <text x="60" y="17" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="10" fill="#fbbf24" letter-spacing="1">DOLBY ATMOS</text>
  </g>

  <!-- Bottom Badges Bar -->
  <g transform="translate(400, 395)" text-anchor="middle">
    <text x="0" y="0" font-family="sans-serif" font-weight="700" font-size="11" fill="#64748b" letter-spacing="1">
      PANTALLA PRIVADA • 4K ULTRA HD • DEPORTES Y SERIES EXCLUSIVAS
    </text>
  </g>
</svg>
