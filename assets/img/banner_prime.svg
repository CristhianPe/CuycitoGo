<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <radialGradient id="primeBg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#0a2540"/>
      <stop offset="50%" stop-color="#051322"/>
      <stop offset="100%" stop-color="#02080f"/>
    </radialGradient>
    <linearGradient id="primeCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00a8e1"/>
      <stop offset="100%" stop-color="#007eb9"/>
    </linearGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#primeBg)"/>

  <!-- Glowing Aura -->
  <circle cx="400" cy="200" r="160" fill="#00a8e1" opacity="0.25" filter="url(#glowCyan)"/>

  <!-- Prime Video Logo Area -->
  <g transform="translate(400, 190)" text-anchor="middle">
    <!-- prime wordmark -->
    <text x="0" y="10" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="76" fill="#ffffff" letter-spacing="-2">
      prime video
    </text>

    <!-- Official Amazon Prime Smile Curve Arrow -->
    <path d="M -160 38 Q 0 85 160 38" fill="none" stroke="#00a8e1" stroke-width="9" stroke-linecap="round" filter="url(#glowCyan)"/>
    <!-- Arrow Head -->
    <path d="M 148 24 L 175 42 L 152 64 Z" fill="#00a8e1" filter="url(#glowCyan)"/>
  </g>

  <!-- Subtitle Originals (The Boys, Fallout, Rings of Power, Invincible) -->
  <g transform="translate(400, 290)" text-anchor="middle">
    <rect x="-260" y="-18" width="520" height="36" rx="18" fill="#000000" fill-opacity="0.6" stroke="#0e395e" stroke-width="1.5"/>
    <text x="0" y="5" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="11" fill="#38bdf8" letter-spacing="3">
      SERIES ORIGINALES • ESTRENOS EXCLUSIVOS • 4K HDR
    </text>
  </g>

  <!-- Top Badges -->
  <g transform="translate(40, 45)">
    <rect width="120" height="26" rx="6" fill="#00a8e1" fill-opacity="0.25" stroke="#00a8e1" stroke-width="1"/>
    <text x="60" y="17" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="10" fill="#38bdf8" letter-spacing="1">PRIME ORIGINAL</text>
  </g>

  <g transform="translate(640, 45)">
    <rect width="120" height="26" rx="6" fill="#000000" fill-opacity="0.6" stroke="#fbbf24" stroke-width="1"/>
    <text x="60" y="17" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="10" fill="#fbbf24" letter-spacing="1">PIN EXCLUSIVO</text>
  </g>

  <!-- Bottom Badges Bar -->
  <g transform="translate(400, 395)" text-anchor="middle">
    <text x="0" y="0" font-family="sans-serif" font-weight="700" font-size="11" fill="#64748b" letter-spacing="1">
      PANTALLA PRIVADA • ULTRA HD • DESCARGAS SIN CONEXIÓN
    </text>
  </g>
</svg>
