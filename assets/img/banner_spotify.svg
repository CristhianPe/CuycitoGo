<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <radialGradient id="spotBg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#0a3618"/>
      <stop offset="50%" stop-color="#041a0b"/>
      <stop offset="100%" stop-color="#020a05"/>
    </radialGradient>
    <linearGradient id="spotGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1ed760"/>
      <stop offset="100%" stop-color="#1db954"/>
    </linearGradient>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#spotBg)"/>

  <!-- Glowing Emerald Aura -->
  <circle cx="400" cy="180" r="160" fill="#1db954" opacity="0.28" filter="url(#glowGreen)"/>

  <!-- Equalizer waves visualizer in background -->
  <g opacity="0.25" fill="#1ed760">
    <rect x="80" y="240" width="6" height="60" rx="3"/>
    <rect x="100" y="210" width="6" height="90" rx="3"/>
    <rect x="120" y="170" width="6" height="130" rx="3"/>
    <rect x="140" y="230" width="6" height="70" rx="3"/>
    <rect x="160" y="190" width="6" height="110" rx="3"/>

    <rect x="634" y="200" width="6" height="100" rx="3"/>
    <rect x="654" y="160" width="6" height="140" rx="3"/>
    <rect x="674" y="220" width="6" height="80" rx="3"/>
    <rect x="694" y="190" width="6" height="110" rx="3"/>
    <rect x="714" y="240" width="6" height="60" rx="3"/>
  </g>

  <!-- Official Spotify Logo Icon -->
  <g transform="translate(400, 160)" text-anchor="middle">
    <!-- Big Circle with 3 soundwaves -->
    <circle cx="-135" cy="0" r="48" fill="#1db954" filter="url(#glowGreen)"/>
    <!-- Wave 1 (Top) -->
    <path d="M -162 -14 Q -135 -27 -108 -15" fill="none" stroke="#000000" stroke-width="6.5" stroke-linecap="round"/>
    <!-- Wave 2 (Middle) -->
    <path d="M -158 0 Q -135 -10 -112 0" fill="none" stroke="#000000" stroke-width="5.5" stroke-linecap="round"/>
    <!-- Wave 3 (Bottom) -->
    <path d="M -154 13 Q -135 5 -116 13" fill="none" stroke="#000000" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Typography -->
    <text x="60" y="16" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="58" fill="#ffffff" letter-spacing="-1">
      Spotify
    </text>
  </g>

  <!-- Subtitle Premium Individual (Musica Sin Anuncios, Offline, Audio 320kbps) -->
  <g transform="translate(400, 275)" text-anchor="middle">
    <rect x="-240" y="-18" width="480" height="36" rx="18" fill="#000000" fill-opacity="0.6" stroke="#1db954" stroke-width="1.5"/>
    <text x="0" y="5" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="11" fill="#4ade80" letter-spacing="3">
      PREMIUM INDIVIDUAL • SIN ANUNCIOS • AUDIO HI-FI
    </text>
  </g>

  <!-- Top Badges -->
  <g transform="translate(40, 45)">
    <rect width="120" height="26" rx="6" fill="#1db954" fill-opacity="0.25" stroke="#1db954" stroke-width="1"/>
    <text x="60" y="17" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="10" fill="#4ade80" letter-spacing="1">MÚSICA ILIMITADA</text>
  </g>

  <g transform="translate(640, 45)">
    <rect width="120" height="26" rx="6" fill="#000000" fill-opacity="0.6" stroke="#fbbf24" stroke-width="1"/>
    <text x="60" y="17" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="10" fill="#fbbf24" letter-spacing="1">CUENTA PROPIA</text>
  </g>

  <!-- Bottom Badges Bar -->
  <g transform="translate(400, 395)" text-anchor="middle">
    <text x="0" y="0" font-family="sans-serif" font-weight="700" font-size="11" fill="#64748b" letter-spacing="1">
      MODO OFFLINE • SALTO ILIMITADO DE CANCIONES • CALIDAD MÁXIMA
    </text>
  </g>
</svg>
