<!DOCTYPE html>
<html lang="es" class="h-full bg-[#0a0a0a]">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CuycitoGO - Login Administrador</title>
    <link rel="icon" type="image/png" href="assets/img/logo.png">
    <link rel="apple-touch-icon" href="assets/img/logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { 
            theme: { 
                extend: { 
                    colors: { 
                        cuycito: { 
                            black: '#0a0a0a', 
                            red: '#850000', 
                            gold: '#ffb703' 
                        } 
                    } 
                } 
            } 
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="h-full flex items-center justify-center font-sans selection:bg-cuycito-gold selection:text-black relative overflow-hidden">

    <!-- MODAL EMERGENTE: INVITACIÓN AL CANAL DE WHATSAPP -->
    <div id="whatsappChannelModal" class="fixed inset-0 bg-black/85 backdrop-blur-sm flex items-center justify-center p-4 z-50 transition-opacity duration-300 opacity-0 pointer-events-none">
        <div class="bg-[#141414] border-2 border-emerald-500/60 rounded-3xl p-6 sm:p-8 max-w-sm w-full text-center space-y-5 shadow-2xl relative transform transition-all duration-300 scale-90" id="whatsappModalCard" style="box-shadow: 0 0 35px rgba(16, 185, 129, 0.35);">
            
            <!-- Botón cerrar X -->
            <button onclick="closeWhatsAppModal()" class="absolute top-3.5 right-3.5 w-8 h-8 rounded-full bg-gray-900 hover:bg-gray-800 text-gray-400 hover:text-white flex items-center justify-center text-sm transition border border-gray-800">
                <i class="fa-solid fa-xmark"></i>
            </button>

            <!-- Icono animado WhatsApp -->
            <div class="w-16 h-16 mx-auto rounded-2xl bg-emerald-500/10 border border-emerald-500/40 flex items-center justify-center text-3xl text-emerald-400 shadow-[0_0_25px_rgba(16,185,129,0.3)]">
                <i class="fa-brands fa-whatsapp animate-bounce"></i>
            </div>

            <!-- Textos -->
            <div class="space-y-2">
                <div class="inline-flex items-center gap-1.5 bg-emerald-950 text-emerald-300 border border-emerald-500/40 text-[10px] font-black px-3 py-1 rounded-full uppercase tracking-wider">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
                    <span>Comunidad Oficial</span>
                </div>
                <h2 class="text-lg sm:text-xl font-black text-white leading-tight">
                    ¡Únete a nuestro Canal de WhatsApp!
                </h2>
                <p class="text-xs text-gray-300 leading-relaxed">
                    No te pierdas de las nuevas actualizaciones, ofertas exclusivas, novedades y estados del servicio en tiempo real.
                </p>
            </div>

            <!-- Botones de Acción -->
            <div class="space-y-2.5 pt-1">
                <a href="https://whatsapp.com/channel/0029VbDAA9vLY6d7VmZLa43R" target="_blank" onclick="closeWhatsAppModal()" class="w-full bg-gradient-to-r from-emerald-600 to-green-500 hover:from-emerald-500 hover:to-green-400 text-white font-black text-xs py-3.5 rounded-xl transition shadow-lg flex items-center justify-center gap-2 uppercase tracking-wider">
                    <i class="fa-brands fa-whatsapp text-base"></i>
                    <span>Unirme al Canal Ahora</span>
                </a>

                <button onclick="closeWhatsAppModal()" class="w-full bg-gray-900 hover:bg-gray-800 text-gray-400 hover:text-gray-200 font-bold text-xs py-2.5 rounded-xl transition">
                    Continuar al Login
                </button>
            </div>
        </div>
    </div>

    <!-- TARJETA PRINCIPAL DE LOGIN -->
    <div class="bg-[#141414] p-8 rounded-3xl border border-cuycito-gold/50 glow-gold w-full max-w-sm text-center shadow-2xl relative z-10">
        <img src="assets/img/logo.png" alt="CuycitoGO" class="w-24 h-24 mx-auto mb-4 rounded-2xl object-contain drop-shadow-[0_0_20px_rgba(255,183,3,0.4)]">
        
        <h1 class="text-2xl font-black tracking-widest text-cuycito-gold mb-1" style="font-family: impact, sans-serif;">CuycitoGO</h1>
        <p class="text-[10px] text-gray-400 uppercase tracking-widest font-bold mb-6">Panel de Administración</p>

        <form id="loginForm" class="space-y-4 text-left text-xs">
            <div>
                <label class="block text-gray-400 mb-1 font-bold">Correo de Administrador</label>
                <input type="email" id="email" required placeholder="tu_correo_admin@ejemplo.com" class="w-full bg-black border border-gray-800 rounded p-2.5 text-white outline-none focus:border-cuycito-gold transition">
            </div>
            <div>
                <label class="block text-gray-400 mb-1 font-bold">Contraseña</label>
                <input type="password" id="password" required placeholder="••••••••" class="w-full bg-black border border-gray-800 rounded p-2.5 text-white outline-none focus:border-cuycito-gold transition">
            </div>
            <p id="errorMsg" class="text-red-500 font-bold hidden text-center">❌ Credenciales incorrectas.</p>
            
            <button type="submit" id="loginBtn" class="w-full bg-cuycito-red hover:bg-[#b91c1c] text-white font-black py-3 rounded transition uppercase tracking-widest shadow-[0_0_15px_rgba(133,0,0,0.5)] mt-2">
                Ingresar al Gestor
            </button>
        </form>

        <div class="mt-6 pt-4 border-t border-gray-900">
            <a href="https://whatsapp.com/channel/0029VbDAA9vLY6d7VmZLa43R" target="_blank" class="text-[11px] text-emerald-400 hover:text-emerald-300 transition flex items-center justify-center gap-1.5 font-bold">
                <i class="fa-brands fa-whatsapp text-sm"></i>
                <span>Canal de WhatsApp CuycitoGO</span>
            </a>
        </div>
    </div>

    <script type="module">
        import { auth, signInWithEmailAndPassword, onAuthStateChanged } from "./js/firebase-config.js";

        // Control de Modal Emergente WhatsApp
        window.openWhatsAppModal = () => {
            const modal = document.getElementById('whatsappChannelModal');
            const card = document.getElementById('whatsappModalCard');
            if (modal && card) {
                modal.classList.remove('opacity-0', 'pointer-events-none');
                modal.classList.add('opacity-100');
                card.classList.remove('scale-90');
                card.classList.add('scale-100');
            }
        };

        window.closeWhatsAppModal = () => {
            const modal = document.getElementById('whatsappChannelModal');
            const card = document.getElementById('whatsappModalCard');
            if (modal && card) {
                modal.classList.remove('opacity-100');
                modal.classList.add('opacity-0', 'pointer-events-none');
                card.classList.remove('scale-100');
                card.classList.add('scale-90');
            }
        };

        // Cerrar al presionar fuera de la tarjeta
        document.getElementById('whatsappChannelModal').addEventListener('click', (e) => {
            if (e.target.id === 'whatsappChannelModal') {
                window.closeWhatsAppModal();
            }
        });

        // Mostrar popup automáticamente al cargar tras 400ms
        setTimeout(() => {
            window.openWhatsAppModal();
        }, 400);

        // Si detecta cualquier cuenta oficial de Firebase Auth (Tú), entra directo.
        onAuthStateChanged(auth, (user) => {
            if (user) {
                window.location.replace('dashboard');
            }
        });

        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const pass = document.getElementById('password').value.trim();
            const btn = document.getElementById('loginBtn');
            const errorMsg = document.getElementById('errorMsg');

            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Verificando...';
            errorMsg.classList.add('hidden');

            signInWithEmailAndPassword(auth, email, pass)
                .then(() => {
                    window.location.replace('dashboard');
                })
                .catch((error) => {
                    console.error(error);
                    btn.innerHTML = 'Ingresar al Gestor';
                    errorMsg.classList.remove('hidden');
                });
        });
    </script>
</body>
</html>
